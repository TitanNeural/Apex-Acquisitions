{% extends "base.html" %}
{% block title %}Property Search - ApexAcquisitions{% endblock %}

{% block content %}
<section class="dashboard">
    <div class="container">
        <h1>Property Search</h1>
        <p class="subtitle">Find distressed properties and motivated sellers.</p>

        <div class="auth-card" style="max-width:100%;margin-bottom:32px;">
            <form id="searchForm" onsubmit="searchProperties(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" class="form-control" placeholder="e.g. Denver">
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" class="form-control" placeholder="e.g. CO" maxlength="2">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="propertyType">Property Type</label>
                        <select id="propertyType" class="form-control">
                            <option value="">All Types</option>
                            <option value="sfr">Single Family</option>
                            <option value="multi_family">Multi-Family</option>
                            <option value="condo">Condo</option>
                            <option value="townhouse">Townhouse</option>
                            <option value="land">Land</option>
                            <option value="commercial">Commercial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="distressType">Distress Flag</label>
                        <select id="distressType" class="form-control">
                            <option value="">Any</option>
                            <option value="pre_foreclosure">Pre-Foreclosure</option>
                            <option value="foreclosure">Foreclosure</option>
                            <option value="tax_lien">Tax Lien</option>
                            <option value="probate">Probate</option>
                            <option value="vacant">Vacant</option>
                            <option value="absentee_owner">Absentee Owner</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="minPrice">Min Price</label>
                        <input type="number" id="minPrice" class="form-control" placeholder="$0">
                    </div>
                    <div class="form-group">
                        <label for="maxPrice">Max Price</label>
                        <input type="number" id="maxPrice" class="form-control" placeholder="$500,000">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Search Properties</button>
            </form>
        </div>

        <div class="dashboard-section">
            <h2>Results</h2>
            <ul class="activity-list" id="resultsList">
                <li><span>Enter search criteria above to find properties.</span></li>
            </ul>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
function searchProperties(e) {
    e.preventDefault();
    const resultsList = document.getElementById('resultsList');
    resultsList.innerHTML = '<li><span>Property search coming soon. Database integration in progress.</span></li>';
}
</script>
{% endblock %}
