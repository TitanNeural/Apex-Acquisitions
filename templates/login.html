{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your account</p>

        <div class="alert alert-error" id="loginError"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Log In</button>
        </form>

        <p class="form-footer">
            Don't have an account? <a href="/register">Sign up</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginSubmit');
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    btn.textContent = 'Logging in...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        localStorage.setItem('token', data.access_token);
        window.location.href = '/dashboard';
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
    } finally {
        btn.textContent = 'Log In';
        btn.disabled = false;
    }
}
</script>
{% endblock %}
